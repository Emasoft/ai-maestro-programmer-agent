[project]
name = "ai-maestro-programmer-agent"
version = "2.0.7"
description = "Programmer Agent plugin for AI Maestro"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml"]

[tool.ruff]
line-length = 320

# Pin the lint gate to the rule set this project has shipped every release under
# (ruff's long-standing E4/E7/E9/F default). publish.py runs ruff UNPINNED
# (`uv run --with ruff`), so without an explicit select the gate silently drifts
# with each ruff release: ruff 0.16.0 expanded its default to BLE001/PLW1510/S110/
# etc., surfacing 64 pre-existing tooling lints and blocking publishes that passed
# under older ruff. This restores the shipped gate deterministically — it does NOT
# relax it (E4/E7/E9/F is the standard v1.4.x met). Adopting the stricter defaults
# would be a separate, opt-in decision. See TRDD-1TXG0EON.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
